<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice #{{INVOICE_ID}}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-grad-1: #0f172a;
            --bg-grad-2: #1e1b4b;
            --surface: rgba(255, 255, 255, 0.05);
            --surface-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2));
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .invoice-container {
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--surface-border);
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: floatIn 0.6s ease-out forwards;
        }
        @keyframes floatIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2.5rem;
            border-bottom: 1px solid var(--surface-border);
            padding-bottom: 2rem;
        }
        .brand h1 { font-size: 2rem; font-weight: 700; background: linear-gradient(to right, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .invoice-meta { text-align: right; }
        .invoice-meta h2 { font-size: 1.25rem; font-weight: 600; color: var(--text-main); }
        .invoice-meta p { font-size: 0.875rem; color: var(--text-muted); margin-top: 0.25rem; }
        
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2.5rem;
        }
        .detail-group label { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.5rem; }
        .detail-group p { font-size: 1rem; font-weight: 500; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 2rem; }
        th { text-align: left; padding: 1rem 0; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); border-bottom: 1px solid var(--surface-border); }
        td { padding: 1rem 0; font-size: 0.95rem; border-bottom: 1px solid rgba(255,255,255,0.02); }
        th:last-child, td:last-child { text-align: right; }
        
        .totals {
            margin-left: auto;
            width: 100%;
            max-width: 300px;
        }
        .total-row {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        .total-row.grand-total {
            color: var(--text-main);
            font-size: 1.25rem;
            font-weight: 700;
            border-top: 1px solid var(--surface-border);
            margin-top: 0.5rem;
            padding-top: 1.25rem;
        }
        
        .actions {
            margin-top: 3rem;
            display: flex;
            justify-content: center;
        }
        .btn {
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 1rem 2rem;
            border-radius: 99px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 15px 20px -3px rgba(79, 70, 229, 0.4); }
        
        @media (max-width: 600px) {
            .invoice-container { padding: 2rem 1.5rem; }
            .header { flex-direction: column; gap: 1.5rem; }
            .invoice-meta { text-align: left; }
            .details-grid { grid-template-columns: 1fr; gap: 1.5rem; }
            th, td { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <div class="invoice-container">
        <div class="header">
            <div class="brand">
                <h1>Salon BMS</h1>
            </div>
            <div class="invoice-meta">
                <h2>INVOICE #{{INVOICE_ID}}</h2>
                <p>{{DATE}}</p>
            </div>
        </div>
        
        <div class="details-grid">
            <div class="detail-group">
                <label>Billed To</label>
                <p>{{PHONE}}</p>
            </div>
            <div class="detail-group">
                <label>Payment Method</label>
                <p>{{PAYMENT_MODE}}</p>
            </div>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>Description</th>
                    <th>Qty</th>
                    <th>Price</th>
                    <th>Amount</th>
                </tr>
            </thead>
            <tbody>
                {{ITEMS_HTML}}
            </tbody>
        </table>
        
        <div class="totals">
            <div class="total-row">
                <span>Subtotal</span>
                <span>₹{{SUBTOTAL}}</span>
            </div>
            <div class="total-row">
                <span>Discount</span>
                <span>-₹{{DISCOUNT}}</span>
            </div>
            <div class="total-row grand-total">
                <span>Total</span>
                <span>₹{{TOTAL}}</span>
            </div>
        </div>
        
        <div class="actions">
            <button onclick="downloadPDF()" class="btn" style="border:none; cursor:pointer;">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Download PDF
            </button>
        </div>
    </div>

    <script>
        const invoiceData = {{INVOICE_JSON}};

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            
            // Standard A4 PDF, unit = points (pt)
            const doc = new jsPDF('p', 'pt', 'a4');
            
            // 1. Page Properties (White Background is default)
            doc.setFillColor(255, 255, 255);
            doc.rect(0, 0, doc.internal.pageSize.width, doc.internal.pageSize.height, 'F');
            
            // 2. Variables for Fonts and Colors
            const mainFont = 'helvetica';
            const primaryColor = [79, 70, 229]; // #4F46E5
            const textColor = [15, 23, 42]; // Very dark blue/black
            const labelColor = [100, 116, 139]; // Muted gray
            
            let y = 50;
            
            // 3. Header section
            doc.setFont(mainFont, 'bold');
            doc.setFontSize(28);
            doc.setTextColor(primaryColor[0], primaryColor[1], primaryColor[2]);
            doc.text("Salon BMS", 40, y);
            
            doc.setFontSize(16);
            doc.setTextColor(textColor[0], textColor[1], textColor[2]);
            doc.text(`INVOICE #${invoiceData.id}`, doc.internal.pageSize.width - 40, y, { align: 'right' });
            
            y += 20;
            doc.setFontSize(10);
            doc.setFont(mainFont, 'normal');
            doc.setTextColor(labelColor[0], labelColor[1], labelColor[2]);
            doc.text(new Date(invoiceData.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }), doc.internal.pageSize.width - 40, y, { align: 'right' });
            
            y += 40;
            doc.setDrawColor(226, 232, 240); // light gray line
            doc.setLineWidth(1);
            doc.line(40, y, doc.internal.pageSize.width - 40, y);
            
            y += 30;
            
            // 4. Details Section (Billed To & Payment Mode)
            doc.setFontSize(9);
            doc.setTextColor(labelColor[0], labelColor[1], labelColor[2]);
            doc.text("BILLED TO", 40, y);
            doc.text("PAYMENT METHOD", 300, y);
            
            y += 15;
            doc.setFontSize(12);
            doc.setFont(mainFont, 'bold');
            doc.setTextColor(textColor[0], textColor[1], textColor[2]);
            const customerPhone = (invoiceData.customers && invoiceData.customers.phone) ? invoiceData.customers.phone : 'N/A';
            doc.text(customerPhone, 40, y);
            doc.text(invoiceData.payment_mode, 300, y);
            
            y += 30;
            
            // 5. Build Table Data
            const tableRows = [];
            if (invoiceData.invoice_items) {
                invoiceData.invoice_items.forEach(item => {
                    tableRows.push([
                        item.item_name,
                        item.qty.toString(),
                        `₹${item.unit_price.toFixed(2)}`,
                        `₹${item.line_total.toFixed(2)}`
                    ]);
                });
            }
            
            // 6. Generate standard properties Table
            doc.autoTable({
                startY: y,
                head: [['DESCRIPTION', 'QTY', 'PRICE', 'AMOUNT']],
                body: tableRows,
                theme: 'plain',
                styles: {
                    font: mainFont,
                    fontSize: 10,
                    cellPadding: 8,
                    textColor: textColor
                },
                headStyles: {
                    fontStyle: 'bold',
                    fontSize: 9,
                    textColor: labelColor,
                    lineColor: [226, 232, 240],
                    lineWidth: { bottom: 1 }
                },
                bodyStyles: {
                    lineColor: [241, 245, 249],
                    lineWidth: { bottom: 1 }
                },
                columnStyles: {
                    1: { halign: 'right' },
                    2: { halign: 'right' },
                    3: { halign: 'right' }
                },
                margin: { left: 40, right: 40 }
            });
            
            // 7. Totals Section
            y = doc.lastAutoTable.finalY + 30;
            const rightEdge = doc.internal.pageSize.width - 40;
            
            doc.setFontSize(10);
            doc.setFont(mainFont, 'normal');
            doc.setTextColor(labelColor[0], labelColor[1], labelColor[2]);
            doc.text("Subtotal", rightEdge - 100, y);
            doc.setTextColor(textColor[0], textColor[1], textColor[2]);
            doc.text(`₹${invoiceData.subtotal.toFixed(2)}`, rightEdge, y, { align: 'right' });
            
            y += 20;
            doc.setTextColor(labelColor[0], labelColor[1], labelColor[2]);
            doc.text("Discount", rightEdge - 100, y);
            doc.setTextColor(textColor[0], textColor[1], textColor[2]);
            doc.text(`-₹${invoiceData.discount.toFixed(2)}`, rightEdge, y, { align: 'right' });
            
            y += 15;
            doc.setDrawColor(226, 232, 240);
            doc.line(rightEdge - 120, y, rightEdge, y);
            
            y += 20;
            doc.setFontSize(14);
            doc.setFont(mainFont, 'bold');
            doc.setTextColor(textColor[0], textColor[1], textColor[2]);
            doc.text("Total", rightEdge - 100, y);
            doc.text(`₹${invoiceData.total.toFixed(2)}`, rightEdge, y, { align: 'right' });
            
            // Save the document
            doc.save(`invoice_${invoiceData.id}.pdf`);
        }
    </script>
</body>
</html>
